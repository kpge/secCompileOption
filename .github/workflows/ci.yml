# Daily CI for secCompileCheck (scc).
# Runs on GitHub-hosted runners (free for public repos): builds for all
# supported platforms, runs the test suite, then smoke-tests the built
# Linux binary against real ELF files compiled on the runner.

name: CI

on:
  schedule:
    # 03:30 UTC daily (11:30 Beijing time), off the top of the hour to
    # reduce load on shared GitHub infrastructure.
    - cron: "30 3 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref so pushes during a CI run don't
# queue up stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/scc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/scc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  smoke:
    # End-to-end matrix check on a real Linux system, ported from
    # checksec's tests/binaries/build_binaries.sh approach: compile real
    # binaries with gcc and clang across hardening combinations, then
    # assert scc classifies every one correctly. Also includes checksec's
    # false__stack_chk_fail trap function, which catches implementations
    # that detect canaries by substring-matching symbol names.
    name: Smoke test (real binaries)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build scc
        run: go build -o scc ./cmd/scc

      - name: Compile test matrix
        run: |
          mkdir -p smoke
          cat > smoke/test.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>

          /* checksec's trap: a symbol whose NAME contains the canary marker
             but has nothing to do with stack protection. A checker that
             substring-matches __stack_chk_fail must not report a canary. */
          int false__stack_chk_fail(int a) { return a; }

          int main(int argc, char **argv) {
            char buf[16];
            int (*op)(int) = false__stack_chk_fail;
            if (argc > 1)
              strcpy(buf, argv[1]);
            else
              strcpy(buf, "test");
            printf("%s,%d\n", buf, op(42));
            return 0;
          }
          EOF

          cd smoke
          for cc in gcc clang; do
            # All hardening on (full RELRO, canary, NX, PIE, fortify, stripped)
            $cc -o all_${cc} test.c -w -D_FORTIFY_SOURCE=2 -fstack-protector-strong \
                -fpie -O2 -z relro -z now -z noexecstack -pie -s
            # Partial RELRO (lazy binding)
            $cc -o partial_${cc} test.c -w -D_FORTIFY_SOURCE=1 -fstack-protector-strong \
                -fpie -O2 -z relro -z lazy -z noexecstack -s
            # RPATH (old-style DT_RPATH tag)
            $cc -o rpath_${cc} test.c -w -D_FORTIFY_SOURCE=2 -fstack-protector-strong \
                -fpie -O2 -z relro -z now -z noexecstack -pie -s \
                -Wl,-rpath,/nonexistent/libdir -Wl,--disable-new-dtags
            # RUNPATH (new-style DT_RUNPATH tag)
            $cc -o runpath_${cc} test.c -w -D_FORTIFY_SOURCE=2 -fstack-protector-strong \
                -fpie -O2 -z relro -z now -z noexecstack -pie -s \
                -Wl,-rpath,/nonexistent/libdir -Wl,--enable-new-dtags
            # No hardening at all (exec stack, no canary, no PIE, no RELRO, symbols kept)
            $cc -o none_${cc} test.c -w -D_FORTIFY_SOURCE=0 -fno-stack-protector \
                -no-pie -O2 -z norelro -z lazy -z execstack
            # Relocatable object → REL classification
            $cc -c test.c -o rel_${cc}.o -w
            # Shared object → DSO classification
            $cc -shared -fPIC -o dso_${cc}.so test.c -w -D_FORTIFY_SOURCE=2 \
                -fstack-protector-strong -O2 -z relro -z now -z noexecstack -s
            # Fortify variant: hardened build without _FORTIFY_SOURCE
            $cc -o nofortify_${cc} test.c -w -fstack-protector-strong -fpie -O2 \
                -z relro -z now -z noexecstack -pie -s
          done
          ls -la

      - name: Assert classifications
        env:
          MATRIX: |
            # file:expected relro:canary:nx:pie:rpath:runpath:fortify
            all_gcc:Full RELRO:Canary found:NX enabled:PIE enabled:No RPATH:No RUNPATH:Yes
            all_clang:Full RELRO:Canary found:NX enabled:PIE enabled:No RPATH:No RUNPATH:Yes
            partial_gcc:Partial RELRO:Canary found:NX enabled:PIE enabled:No RPATH:No RUNPATH:Yes
            partial_clang:Partial RELRO:Canary found:NX enabled:PIE enabled:No RPATH:No RUNPATH:Yes
            rpath_gcc:*:Canary found:*:PIE enabled:RPATH*:No RUNPATH:*
            rpath_clang:*:Canary found:*:PIE enabled:RPATH*:No RUNPATH:*
            runpath_gcc:*:Canary found:*:PIE enabled:No RPATH:RUNPATH*:*
            runpath_clang:*:Canary found:*:PIE enabled:No RPATH:RUNPATH*:*
            none_gcc:No RELRO:No canary found:NX disabled:PIE disabled:No RPATH:No RUNPATH:No
            none_clang:No RELRO:No canary found:NX disabled:PIE disabled:No RPATH:No RUNPATH:No
            rel_gcc.o:*:No canary found:NX unknown (no GNU_STACK):REL (relocatable object):No RPATH:No RUNPATH:*
            rel_clang.o:*:No canary found:NX unknown (no GNU_STACK):REL (relocatable object):No RPATH:No RUNPATH:*
            dso_gcc.so:Full RELRO:Canary found:NX enabled:DSO (shared library):No RPATH:No RUNPATH:*
            dso_clang.so:Full RELRO:Canary found:NX enabled:DSO (shared library):No RPATH:No RUNPATH:*
            nofortify_gcc:Full RELRO:Canary found:NX enabled:PIE enabled:No RPATH:No RUNPATH:No fortifiable calls
            nofortify_clang:Full RELRO:Canary found:NX enabled:PIE enabled:No RPATH:No RUNPATH:No fortifiable calls
        run: |
          cat > assert.py <<'PYEOF'
          import json, os, fnmatch, sys

          checks = json.load(open(os.environ["JSON_FILE"]))[0]["checks"]
          want = {
              "relro": os.environ["EXP_RELRO"],
              "canary": os.environ["EXP_CANARY"],
              "nx": os.environ["EXP_NX"],
              "pie": os.environ["EXP_PIE"],
              "rpath": os.environ["EXP_RPATH"],
              "runpath": os.environ["EXP_RUNPATH"],
              "fortify": os.environ["EXP_FORTIFY"],
          }
          failed = False
          for key, expected in want.items():
              got = checks[key]["value"]
              if not fnmatch.fnmatchcase(got, expected):
                  print(f'{os.environ["BIN"]}: {key} = {got!r}, want {expected!r}', file=sys.stderr)
                  failed = True
          if failed:
              sys.exit(1)
          print(f'{os.environ["BIN"]}: all checks pass')
          PYEOF

          fail=0
          while IFS=: read -r file relro canary nx pie rpath runpath fortify; do
            [ -z "$file" ] && continue
            case "$file" in \#*) continue ;; esac
            echo "--- $file ---"
            ./scc file "smoke/$file" -format json > tmp.json || true
            if BIN="$file" JSON_FILE=tmp.json \
               EXP_RELRO="$relro" EXP_CANARY="$canary" EXP_NX="$nx" EXP_PIE="$pie" \
               EXP_RPATH="$rpath" EXP_RUNPATH="$runpath" EXP_FORTIFY="$fortify" \
               python3 assert.py; then
              :
            else
              fail=1
            fi
          done < <(echo "$MATRIX" | grep -v '^#' | grep -v '^$')
          rm -f assert.py
          exit $fail

      - name: Check exit codes
        run: |
          # Hardened binary passes: exit 0. Vulnerable one fails: exit 2.
          ./scc file smoke/all_gcc
          ./scc file smoke/none_gcc && { echo "expected exit 2 for vulnerable binary"; exit 1; } || [ $? -eq 2 ]
          echo "exit-code semantics OK"

      - name: Check dir scan and formats
        run: |
          # The smoke dir contains intentionally vulnerable binaries, so
          # exit 2 is expected here too.
          ./scc dir smoke -format csv > out.csv || true
          ./scc dir smoke -format xml > out.xml || true
          ./scc dir smoke -format json > out.json || true
          grep -q "smoke/all_gcc" out.csv
          grep -q "<secCompileCheck>" out.xml
          python3 -c "import json; json.load(open('out.json'))"
          echo "all output formats OK"
