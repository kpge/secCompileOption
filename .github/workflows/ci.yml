# Daily CI for secCompileCheck (scc).
# Runs on GitHub-hosted runners (free for public repos): builds for all
# supported platforms, runs the test suite, then smoke-tests the built
# Linux binary against real ELF files compiled on the runner.

name: CI

on:
  schedule:
    # 03:30 UTC daily (11:30 Beijing time), off the top of the hour to
    # reduce load on shared GitHub infrastructure.
    - cron: "30 3 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref so pushes during a CI run don't
# queue up stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/scc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/scc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  smoke:
    # End-to-end real-binary validation, driven by the scripts in tests/
    # (ported from checksec's tests/ layout): compile a gcc/clang hardening
    # matrix, assert every classification, and validate JSON/XML/CSV output
    # schemas. See tests/test-scc.sh to run the same suite locally.
    name: Smoke test (real binaries)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run end-to-end test suite
        run: bash tests/test-scc.sh

      - name: Check exit codes
        run: |
          # Hardened binary passes: exit 0. Vulnerable one fails: exit 2.
          ./scc file tests/binaries/output/all_gcc
          ./scc file tests/binaries/output/none_gcc && { echo "expected exit 2 for vulnerable binary"; exit 1; } || [ $? -eq 2 ]
          echo "exit-code semantics OK"
