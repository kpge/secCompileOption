# Release workflow: publish binaries to a GitHub Release.
#
# Two entry points, both manual-controlled:
#  - workflow_dispatch with a `version` input (vX.Y.Z[-prerelease]); the
#    recommended path, see RELEASE.md. The version passes a whitelist
#    validation job before any tag/release step runs.
#  - push of a v* tag (creates the release for that exact tag).
#
# A release always points at the commit that triggered it; the workflow
# never pushes to a branch and never moves an existing tag.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.0.1"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  # Required to create the Release and upload assets.
  contents: write

jobs:
  validate:
    # Whitelist-check the dispatch version input before anything else runs.
    # The raw input is passed via env (never interpolated into the shell).
    name: Validate version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.norm.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: norm
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION}"
          # Must be vX.Y.Z or vX.Y.Z-{alpha,beta,rc}.N (no leading zeros).
          if ! echo "${v}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'; then
            echo "invalid version: ${v}" >&2
            echo "expected vMAJOR.MINOR.PATCH[-(alpha|beta|rc).N], e.g. v1.0.1 or v2.0.0-beta.1" >&2
            exit 1
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Tag must not already exist
        env:
          VERSION: ${{ steps.norm.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "tag ${VERSION} already exists; delete it first or bump the version" >&2
            exit 1
          fi

  test:
    # Reuse the CI gate so a release can never ship an untested build.
    name: Test (Go ${{ matrix.go }})
    needs: [validate]
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - run: go vet ./...

      - run: go test ./... -count=1

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  release:
    name: Release ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: always() && needs.test.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Tag pushes carry the version in GITHUB_REF_NAME; dispatch runs
          # get it from the validated input.
          VERSION: ${{ github.event_name == 'workflow_dispatch' && needs.validate.outputs.version || github.ref_name }}
        run: |
          mkdir -p release
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          out="release/scc-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${out}" ./cmd/scc
          # Smoke: the built binary must at least identify itself.
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            "${out}" version | grep -F "${VERSION}"
          fi
          sha256sum "${out}" > "${out}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, release]
    if: always() && needs.release.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    env:
      # Same resolution rule as the build jobs.
      VERSION: ${{ github.event_name == 'workflow_dispatch' && needs.validate.outputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the tag exists at this commit
        # Dispatch runs have no tag yet: create it on the current commit.
        # Tag-push runs already have one; verify it points here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            remote_sha=$(git ls-remote --tags origin "refs/tags/${VERSION}" | awk '{print $1}')
            if [ "${remote_sha}" != "${GITHUB_SHA}" ]; then
              echo "tag ${VERSION} exists at ${remote_sha}, not at ${GITHUB_SHA}; refusing to move it" >&2
              exit 1
            fi
          else
            git tag "${VERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/${VERSION}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify checksums
        run: |
          cd dist
          ls -la
          # The .sha256 files record their build-time path prefix
          # (release/); rewrite it to the current directory before
          # verifying, and strip it for the consolidated checksums.txt so
          # users can run sha256sum -c against the downloaded files.
          sed -i 's| release/| |' *.sha256
          failed=0
          for sum in *.sha256; do
            sha256sum -c "${sum}" || failed=1
          done
          [ "${failed}" -eq 0 ] || { echo "checksum verification failed"; exit 1; }
          cat *.sha256 > checksums.txt
          rm -f *.sha256

      - name: Create release notes
        run: |
          TAG="${VERSION}"
          {
            echo "secCompileCheck (scc) ${TAG}"
            echo
            echo "## Downloads"
            echo
            echo "Per-platform binaries below; verify with \`sha256sum -c checksums.txt\`."
            echo
            echo "## What it does"
            echo
            echo "ELF binary security compile-option checker in Go (zero third-party"
            echo "dependencies). Reports RELRO, stack canary, NX, PIE, BIND_NOW,"
            echo "RPATH/RUNPATH, symbols and FORTIFY_SOURCE coverage — including"
            echo "stripped binaries via program-header parsing."
            echo
            echo "\`-format compliance\` grades binaries against the CANN secure-compile"
            echo "specification and exits 2 on any violation (CI-gate ready)."
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/scc-${TAG}-linux-amd64"
            echo "chmod +x scc-${TAG}-linux-amd64"
            echo "sudo mv scc-${TAG}-linux-amd64 /usr/local/bin/scc"
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotency: if the release already exists with identical assets
          # (same names, same SHA-256), skip; any difference is an error.
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${VERSION} already exists"
            gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets -q '.assets[].name' | sort > existing.txt
            (cd dist && ls | sort) > have.txt
            if ! diff -u existing.txt have.txt; then
              echo "existing release assets differ from freshly built ones" >&2
              exit 1
            fi
            for f in dist/*; do
              name=$(basename "${f}")
              gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" -p "${name}" -O /tmp/dl-"${name}" 2>/dev/null || {
                echo "missing asset ${name} in existing release" >&2; exit 1; }
              if ! sha256sum -c <(sha256sum "${f}" | sed "s| ${f}| /tmp/dl-${name}|"); then
                echo "asset ${name} differs from existing release; refusing to overwrite" >&2
                exit 1
              fi
            done
            echo "identical release already published; nothing to do"
            exit 0
          fi
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "secCompileCheck ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*
