# Release workflow: on a pushed v* tag, run the full test suite, build the
# release binaries for every supported platform, and publish them (with a
# SHA-256 checksums file) to a GitHub Release.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # Required to create the Release and upload assets.
  contents: write

jobs:
  test:
    # Reuse the CI gate so a tag can never ship an untested build.
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - run: go vet ./...

      - run: go test ./... -count=1

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  release:
    name: Release ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p release
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          out="release/scc-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "${out}" ./cmd/scc
          # Smoke: the built binary must at least identify itself.
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            "${out}" version
          fi
          sha256sum "${out}" > "${out}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify checksums
        run: |
          cd dist
          ls -la
          # Every .sha256 must match its binary.
          failed=0
          for sum in *.sha256; do
            sha256sum -c "${sum}" || failed=1
          done
          [ "${failed}" -eq 0 ] || { echo "checksum verification failed"; exit 1; }
          # Consolidate into one checksums.txt for the release assets.
          cat *.sha256 > checksums.txt
          rm -f *.sha256

      - name: Create release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          {
            echo "secCompileCheck (scc) ${TAG}"
            echo
            echo "## Downloads"
            echo
            echo "Per-platform binaries below; verify with \`sha256sum -c checksums.txt\`."
            echo
            echo "## What it does"
            echo
            echo "ELF binary security compile-option checker in Go (zero third-party"
            echo "dependencies). Reports RELRO, stack canary, NX, PIE, BIND_NOW,"
            echo "RPATH/RUNPATH, symbols and FORTIFY_SOURCE coverage — including"
            echo "stripped binaries via program-header parsing."
            echo
            echo "\`-format compliance\` grades binaries against the CANN secure-compile"
            echo "specification and exits 2 on any violation (CI-gate ready)."
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/scc-${TAG}-linux-amd64"
            echo "chmod +x scc-${TAG}-linux-amd64"
            echo "sudo mv scc-${TAG}-linux-amd64 /usr/local/bin/scc"
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "secCompileCheck ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*
